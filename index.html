<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Neo Rush</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0618; font-family: system-ui, "Segoe UI", sans-serif; }
      canvas { display: block; }
      .ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }
      h1 { position: absolute; top: 6vh; left: 0; right: 0; margin: 0; text-align: center; font-weight: 600; letter-spacing: 0.04em;
        font-size: clamp(34px, 7vw, 96px); color: #f0b4ff; text-shadow: 0 0 18px rgba(240, 120, 255, 0.55), 0 0 48px rgba(150, 60, 255, 0.4); }
      .side { position: absolute; left: 8vw; top: 62%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
      #play { pointer-events: auto; cursor: pointer; border: 0; padding: 16px 0; width: clamp(180px, 20vw, 300px); font-size: clamp(22px, 2.6vw, 36px);
        font-weight: 700; color: #1a1030; background: #ffe500; box-shadow: 0 0 24px rgba(255, 229, 0, 0.45); transition: transform 0.1s, background 0.1s; }
      #play:hover { background: #fff27a; transform: scale(1.04); }
      .hint { color: #ffe500; font-size: clamp(18px, 1.7vw, 26px); font-weight: 600; line-height: 1.55; margin-top: 10px; text-shadow: 0 0 10px rgba(255, 229, 0, 0.35); }
      .hint b { display: inline-block; min-width: 3.6em; }
      @media (max-width: 700px) { .side { left: 50%; top: auto; bottom: 8vh; transform: translateX(-50%); align-items: center; text-align: center; } }
    </style>
  </head>
  <body>
    <div class="ui">
      <h1>Neo Rush</h1>
      <div class="side">
        <button id="play">Play</button>
        <div class="hint">
          <div><b>W</b> Accelerate</div>
          <div><b>S</b> Brake / Reverse</div>
          <div><b>A D</b> Steer</div>
          <div><b>Space</b> Handbrake / Drift</div>
          <div><b>Shift</b> Jump</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/menu.ts"></script>
  </body>
</html>
